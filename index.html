<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستندات SMOU</title>

<style>
:root{
  --brand:#1c6670;
  --brand-dark:#15545c;
  --bg:#f3f5f6;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma, Arial;
  background:var(--bg);
  padding:20px;
}
.container{
  max-width:1100px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.08);
}
.logo{
  text-align:center;
  margin-bottom:10px;
}
.logo img{
  width:90px;
}
h1{
  text-align:center;
  margin:5px 0 25px;
  font-size:36px;
  font-weight:800;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--brand);
  color:#fff;
  text-decoration:none;
  padding:18px;
  font-size:20px;
  font-weight:700;
  border-radius:15px;
  transition:.2s;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
}
.btn:hover{
  background:var(--brand-dark);
  transform:translateY(-3px);
}
.section-title{
  text-align:center;
  margin:35px 0 15px;
  font-size:18px;
  font-weight:bold;
  color:#555;
}
@media(max-width:768px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
