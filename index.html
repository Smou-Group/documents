<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SMOU GROUP — مجموعة سمو</title>

  <style>
    :root{
      --navy:#0b1b2b;
      --navy2:#12324f;
      --bg:#f4f6f8;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui;background:var(--bg)}
    
    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      position:relative;
      padding:40px 0;
      background:
        url("back.webp") center/cover no-repeat,
        url("back.jpg") center/cover no-repeat,
        url("back.png") center/cover no-repeat,
        linear-gradient(180deg,var(--navy2),var(--navy));
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,.65),rgba(0,0,0,.65));
    }
    .container{
      position:relative;
      max-width:1100px;
      padding:20px;
      margin:auto;
      width:100%;
    }

    /* ===== Back Arrow Button ===== */
    .backBtn{
      position:absolute;
      top:20px;
      left:20px;
      width:46px;
      height:46px;
      border-radius:14px;
      background:rgba(255,255,255,0.10);
      border:1px solid rgba(255,255,255,0.22);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:0 10px 30px rgba(0,0,0,.25);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:transform .25s ease, background .25s ease, box-shadow .25s ease;
    }
    .backBtn:hover{
      background:rgba(255,255,255,0.18);
      transform:translateY(-4px);
      box-shadow:0 18px 45px rgba(0,0,0,.38);
    }
    .backBtn svg{
      width:22px;
      height:22px;
    }

    .logo{
      width:72px;height:72px;
      margin:0 auto 18px;
      border-radius:18px;
      background:rgba(255,255,255,.14);
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .logo img{width:85%;height:85%;object-fit:contain}

    h1{margin:0;font-size:32px}
    p{margin:10px 0 0;opacity:.92;font-size:18px}

    .sectionTitle{
      margin:34px auto 0;
      max-width:920px;
      text-align:right;
      font-size:14px;
      opacity:.9;
      padding:0 4px;
    }
    .divider{
      max-width:920px;
      margin:10px auto 0;
      height:1px;
      background:rgba(255,255,255,.22);
      border-radius:999px;
    }

    .buttons{
      margin:16px auto 0;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:18px;
      max-width:920px;
    }
    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      padding:16px 18px;
      border-radius:18px;
      font-size:16px;
      font-weight:600;
      color:#fff;
      background:rgba(255,255,255,0.10);
      border:1px solid rgba(255,255,255,0.22);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:0 10px 30px rgba(0,0,0,.25);
      transition:transform .25s ease, background .25s ease, box-shadow .25s ease;
    }
    .btn:hover{
      background:rgba(255,255,255,0.18);
      transform:translateY(-6px);
      box-shadow:0 18px 45px rgba(0,0,0,.38);
    }

    @media(max-width:520px){
      h1{font-size:26px}
      p{font-size:15px}
      .btn{font-size:15px}
      .sectionTitle{font-size:13px}
    }
  </style>
</head>

<body>
<section class="hero">
<div class="container">

  <!-- Back Button -->
  <button class="backBtn" onclick="history.back()" aria-label="رجوع">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M15 6 9 12l6 6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="logo">
    <img src="logo.png" alt="SMOU GROUP">
  </div>

  <h1>البوابة الرسمية | مجموعة سمو — SMOU GROUP | Corporate Portal</h1>
  <p>اختر القسم المطلوب للدخول مباشرة</p>

  <div class="sectionTitle">Decoration — الديكورات</div>
  <div class="divider"></div>
  <div class="buttons">
    <a class="btn" href="https://Fuji.smougroup.com/" target="_blank">Fuji Decoration — ديكورات الفوجي</a>
    <a class="btn" href="https://italy.smougroup.com/" target="_blank">Italian Decoration — ديكورات الإيطالي</a>
  </div>

</div>
</section>
</body>
</html>
